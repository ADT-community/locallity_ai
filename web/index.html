<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Locality AI</title>
<meta name="description" content="A voice-first AI assistant that hears and speaks African languages.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">

  <header class="top">
    <div class="brand">Locality<span>.</span></div>
    <div class="top-actions">
      <label class="lang" title="Language">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm6.9 6h-3a15.7 15.7 0 0 0-1.4-3.6A8 8 0 0 1 18.9 8ZM12 4c.8 1.2 1.5 2.5 1.9 4h-3.8c.4-1.5 1.1-2.8 1.9-4ZM4.3 14a8 8 0 0 1 0-4h3.4a16.5 16.5 0 0 0 0 4H4.3Zm.8 2h3a15.7 15.7 0 0 0 1.4 3.6A8 8 0 0 1 5.1 16ZM8 8H5.1a8 8 0 0 1 4.4-3.6C8.9 5.5 8.4 6.7 8 8Zm4 12c-.8-1.2-1.5-2.5-1.9-4h3.8c-.4 1.5-1.1 2.8-1.9 4Zm2.3-6H9.7a14.7 14.7 0 0 1 0-4h4.6a14.7 14.7 0 0 1 0 4Zm.2 5.6c.6-1.1 1.1-2.3 1.4-3.6h3a8 8 0 0 1-4.4 3.6Zm1.8-5.6a16.5 16.5 0 0 0 0-4h3.4a8 8 0 0 1 0 4h-3.4Z"/></svg>
        <select id="lang" aria-label="Language"></select>
      </label>
      <button class="icon-btn" id="handsfree" aria-pressed="false" title="Conversation mode: keep listening after each reply">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 1H7a2 2 0 0 0-2 2v2h2V3h10v2h2V3a2 2 0 0 0-2-2ZM12 8a3 3 0 0 0-3 3v2a3 3 0 0 0 6 0v-2a3 3 0 0 0-3-3Zm6 4h-1.5v1a4.5 4.5 0 0 1-9 0v-1H6v1a6 6 0 0 0 5.2 5.9V21H9v2h6v-2h-2.2v-2.1A6 6 0 0 0 18 13v-1Z"/></svg>
      </button>
      <button class="icon-btn" id="mute" aria-pressed="false" title="Mute spoken replies">
        <svg class="on" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3Zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4ZM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6Z"/></svg>
        <svg class="off" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 12A4.5 4.5 0 0 0 14 8v2.2l2.5 2.5V12ZM19 12c0 .9-.2 1.8-.5 2.6l1.5 1.5A8.9 8.9 0 0 0 21 12a9 9 0 0 0-7-8.8v2.1A7 7 0 0 1 19 12ZM4.3 3 3 4.3 7.7 9H3v6h4l5 5v-6.7l4.3 4.3a7 7 0 0 1-2.3 1.2v2.1a9 9 0 0 0 3.7-1.8l2 2L21 19.7l-9-9L4.3 3ZM12 4 9.9 6.1 12 8.2V4Z"/></svg>
      </button>
    </div>
  </header>

  <main class="history" id="history" aria-label="Conversation">
    <div class="welcome" id="welcome">
      <h1>Talk to me<br>in your language.</h1>
      <p>Tap the microphone and speak. I'll listen and answer out loud.</p>
    </div>
  </main>

  <section class="stage" aria-live="polite">
    <div class="orb-wrap">
      <div class="orb idle" id="orb"><span></span><span></span><span></span></div>
    </div>
    <p class="status" id="status">Tap to talk</p>
    <p class="caption" id="caption"></p>
    <p class="note" id="note" hidden></p>
  </section>

  <form class="typebar" id="typebar" hidden>
    <input id="textInput" type="text" placeholder="Type a message…" autocomplete="off" enterkeyhint="send">
    <button type="submit" class="send" aria-label="Send">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20.5 21 12 3 3.5v6.6L15 12 3 13.9v6.6Z"/></svg>
    </button>
  </form>

  <footer class="controls">
    <button class="side-btn" id="keyboard" aria-label="Type instead" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 5H4a2 2 0 0 0-2 2v10c0 1.1.9 2 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2Zm-9 3h2v2h-2V8Zm0 3h2v2h-2v-2ZM8 8h2v2H8V8Zm0 3h2v2H8v-2Zm-1 2H5v-2h2v2Zm0-3H5V8h2v2Zm9 7H8v-2h8v2Zm0-4h-2v-2h2v2Zm0-3h-2V8h2v2Zm3 3h-2v-2h2v2Zm0-3h-2V8h2v2Z"/></svg>
    </button>
    <button class="mic" id="mic" aria-label="Tap to talk">
      <svg class="i-mic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-6a3.5 3.5 0 0 0-7 0v6A3.5 3.5 0 0 0 12 15Zm6-3.5a6 6 0 0 1-12 0H4a8 8 0 0 0 7 7.9V22h2v-2.6a8 8 0 0 0 7-7.9h-2Z"/></svg>
      <svg class="i-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>
    </button>
    <button class="side-btn" id="clear" aria-label="New conversation">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.7 6.3A8 8 0 1 0 20 12h-2a6 6 0 1 1-1.8-4.2L13 11h7V4l-2.3 2.3Z"/></svg>
    </button>
  </footer>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
